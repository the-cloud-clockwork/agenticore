[project]
name = "agenticore"
version = "1.9.0"
description = "Claude Code runner and orchestrator — thin job lifecycle, repo management, and OTEL pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "The Cloud Clockwork"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.10"
dependencies = [
    # agentihooks intentionally NOT a build-time dep. Image only ships uv;
    # agenticore boot installs agentihooks at runtime — either from PyPI
    # (when AGENTICORE_AGENTIHOOKS_URL+BRANCH are unset) or via volume-mount /
    # external mechanism (when both are set, agenticore stays out).
    "fastmcp>=2.0",
    "mcp>=1,<2",  # server.py imports mcp.server.fastmcp, removed in mcp 2.0
    "redis>=7.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "langfuse>=2.0,<3",
    "PyJWT[crypto]>=2.13.0",  # >=2.13.0 fixes CVE-2026-48524 (PyJWKClient JWKS-refetch DoS)
]

[project.urls]
Homepage = "https://github.com/The-Cloud-Clockwork/agenticore"
Repository = "https://github.com/The-Cloud-Clockwork/agenticore"
Issues = "https://github.com/The-Cloud-Clockwork/agenticore/issues"
Documentation = "https://github.com/The-Cloud-Clockwork/agenticore/tree/main/docs"
Changelog = "https://github.com/The-Cloud-Clockwork/agenticore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
telegram = ["aiogram>=3.15,<4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "fakeredis>=2.21",
    "ruff>=0.4",
]

[project.scripts]
agenticore = "agenticore.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenticore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: no external deps",
    "integration: requires Docker",
]

[tool.ruff]
target-version = "py312"
line-length = 120
